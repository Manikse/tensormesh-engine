<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="bg-glow" id="glow"></div>
    <section class="page">
        <div class="player-container">
            <div class="vinyl-scene" id="vinyl-scene">
                <div class="album-art" style="background-image: url('https://media1.tenor.com/m/X212FF-Fm8IAAAAC/hu-tao-genshin-impact.gif');"></div>
                <div class="vinyl-wrapper"><div class="vinyl-disk"></div></div>
            </div>
            <div style="text-align:center; margin-top:35px">
                <h1 id="track-title" style="margin:0; font-size:32px; font-weight:800">Vesta Player</h1>
                <p id="player-status" style="opacity:0.6">Оберіть плейлист</p>
            </div>
            <button class="btn-juicy" id="play-btn" style="width:85px; height:85px; border-radius:50%; background:var(--accent); font-size:32px; margin-top:35px; box-shadow:0 15px 40px rgba(255, 42, 77, 0.4)"><i class="fas fa-play"></i></button>
        </div>
    </section>
    <nav class="nav-bar">
        <a href="index.html" class="nav-btn active"><i class="fas fa-compact-disc"></i></a>
        <a href="friends.html" class="nav-btn"><i class="fas fa-users"></i></a>
        <a href="playlists.html" class="nav-btn"><i class="fas fa-list-ul"></i></a>
        <a href="settings.html" class="nav-btn"><i class="fas fa-cog"></i></a>
    </nav>
    <script src="app.js"></script>
    <script>
        const playBtn = document.getElementById('play-btn');
        let playing = false;
        playBtn.onclick = () => {
            playing = !playing;
            document.getElementById('vinyl-scene').classList.toggle('playing', playing);
            playBtn.innerHTML = playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if (playing) updateLiveStatus(document.getElementById('track-title').innerText, "Vesta Hub");
        };
        window.addEventListener('DOMContentLoaded', () => {
    const activeCover = localStorage.getItem('active_playlist_cover');
    const activeTitle = localStorage.getItem('active_playlist_id'); // Можна зберігати і назву

    if (activeCover) {
        // Знаходимо твій елемент вінілу або обкладинки
        // Припустимо, у тебе є <img id="vinyl-cover">
        const coverImg = document.getElementById('vinyl-cover');
        const bgGlow = document.getElementById('glow');

        if (coverImg) {
            coverImg.src = activeCover;
        }

        // Додамо атмосферності: міняємо колір фонового сяйва під обкладинку
        if (bgGlow) {
            // Можна додати легкий ефект розмиття фону цією ж картинкою
            bgGlow.style.backgroundImage = `url(${activeCover})`;
            bgGlow.style.backgroundSize = 'cover';
            bgGlow.style.filter = 'blur(80px) opacity(0.4)';
        }
    }
});
    </script>
</body>
</html>
