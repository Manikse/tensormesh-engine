<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vesta Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="bg-glow" id="glow"></div>

    <section class="page">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 style="font-weight:800; font-size:32px; color:#FFF; margin:0;">Медіатека</h1>
            <i class="fas fa-plus-circle" style="font-size: 24px; opacity: 0.5;" onclick="window.location.href='settings.html'"></i>
        </div>

        <div id="library-grid" class="library-grid">
            <div style="grid-column: 1/-1; text-align:center; padding-top:100px; opacity:0.3">
                <i class="fas fa-circle-notch fa-spin" style="font-size:30px; margin-bottom:15px"></i>
                <p>Шукаємо твої скарби...</p>
            </div>
        </div>
    </section>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn"><i class="fas fa-compact-disc"></i></a>
        <a href="friends.html" class="nav-btn"><i class="fas fa-users"></i></a>
        <a href="playlists.html" class="nav-btn active"><i class="fas fa-list-ul"></i></a>
        <a href="settings.html" class="nav-btn"><i class="fas fa-cog"></i></a>
    </nav>

    <script src="app.js"></script>
    <script>
        // Викликаємо функцію завантаження, яку ми прописали в app.js
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof loadLibrary === 'function') {
                loadLibrary();
            } else {
                console.error("Функція loadLibrary не знайдена в app.js");
            }
        });
    </script>
</body>
</html>
